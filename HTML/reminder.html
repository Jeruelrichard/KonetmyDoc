<body>
   <header class="first-header"><h1>Reminder Settings</h1>

  </div>
  </div>
  </header>
  
  <header class="second-header">
    <input type="checkbox" id="sidebar-active">
    <label for="sidebar-active" class="open-sidebar-button">
    <svg xmlns="http://www.w3.org/2000/svg" height="32px" viewBox="0 -960 960 960" width="32px" fill="#1f1f1f"><path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/></svg>

      <label for="sidebar-active" class="close-sidebar-button">
        <svg xmlns="http://www.w3.org/2000/svg" height="32px" viewBox="0 -960 960 960" width="32px" fill="#1f1f1f"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>

      <a href="appointment.html">Intake Form</a>

      <a href="dashboard.html">User Dashboard</a>
      <button onclick="window.history.back()">Back</button>
    </div>
  </header>
  
  <main>
  <nav>
   <a href="home.html"><i class="fa-solid fa-house fa-3x"></i></a>
   <a href="help.html"><i class="fa-solid fa-circle-question fa-3x"></i></a>
   <a href="#"><i class="fa-solid fa-headset fa-3x"></i></a>
   <a href="about.html"><i class="fa-solid fa-circle-info fa-3x"></i></a>
   <button onclick="window.history.back()"><i class="fa-solid fa-arrow-left-long fa-3x"></i></button>
  </nav>
  
  <div class="reminder-content">
    <div class="remind">
      <p><a href="">Reminder Methods</a></p> 
      <div id="myspan">
          <div class="span"></div>
     <i class="fa fa-chevron-down" aria-hidden="true"></i>
      </div>
    </div>

    <div id="messages">
      <p>Email</p>
      <p>SMS/Text</p>
      <p>Push Notification</p>
    </div>

    <div class="reply">
      <p><a href="">Reminder Timing</a></p>
      <div id="Newspan">
        <div class="span"></div>
          <i class="fa fa-chevron-down" aria-hidden="true"></i>
      </div>
    </div>

    <div id="Timing">
      <p>1 Day before</p>
      <p>3 Hours before</p>
      <p>1 Hour before</p>
    </div>

    <div class="optout">
      <p><a href="">Opt-Out</a></p> 
      <div id="outspan">
         <div class="span"></div>
      <i class="fa fa-chevron-down" aria-hidden="true"></i>
      </div>
    </div>

    <div id="turnoff">
        <p>Turn Off Notification</p>
    </div>
  </div>
  </main>

<script>

let span = document.getElementById("myspan");
let is_open = false

span.addEventListener("click",()=>{

  if(is_open === false){
  document.getElementById("messages").style.display ="none"

  is_open = true

  }else{
     document.getElementById("messages").style.display ="block"
     is_open = false

  }
 

  });

 
  let Newspan = document.getElementById("Newspan")

  let open = false
  Newspan.addEventListener("click",()=>{

    if(open === false){
    document.getElementById("Timing").style.display ="none"

    open= true

  }else{
     document.getElementById("Timing").style.display ="block"

     open = false

  }

  });

  let outspan = document.getElementById("outspan");
  let openicon = false
  outspan.addEventListener("click",()=>{
    if(openicon === false){

    document.getElementById("turnoff").style.display ="none"
    openicon = true

}else{
  document.getElementById("turnoff").style.display ="block"

 openicon = false
}
  });

</script>




</body>
